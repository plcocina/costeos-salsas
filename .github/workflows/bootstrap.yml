name: Publicar Costeo Salsas

on:
  push:
    branches: [main]
    paths:
      - '.bundle2/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio
        shell: bash
        run: |
          mkdir -p /tmp/costeo-salsas
          cat .bundle2/p01.b64 .bundle2/p02.b64 .bundle2/p03.b64 .bundle2/p04.b64 .bundle2/p05.b64 .bundle2/p06.b64 .bundle2/p07.b64 .bundle2/p08.b64 .bundle2/p09.b64 .bundle2/p10.b64 .bundle2/p11.b64 .bundle2/p12.b64 | base64 -d > /tmp/costeo-salsas.zip
          unzip -q /tmp/costeo-salsas.zip -d /tmp/costeo-salsas

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: /tmp/costeo-salsas
        run: npm install

      - name: Compilar sitio
        working-directory: /tmp/costeo-salsas
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/costeo-salsas/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
