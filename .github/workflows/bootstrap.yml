name: Preparar y publicar Costeo Salsas

on:
  push:
    branches: [main]
    paths:
      - '.bundle2/p12.b64'
      - '.bundle2/trigger.txt'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir proyecto
        shell: bash
        run: |
          cat .bundle2/p01.b64 .bundle2/p02.b64 .bundle2/p03.b64 .bundle2/p04.b64 .bundle2/p05.b64 .bundle2/p06.b64 .bundle2/p07.b64 .bundle2/p08.b64 .bundle2/p09.b64 .bundle2/p10.b64 .bundle2/p11.b64 .bundle2/p12.b64 | base64 -d > /tmp/project.zip
          unzip -t /tmp/project.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bundle ! -name .bundle2 ! -name .github ! -name README.md -exec rm -rf {} +
          cp -a /tmp/project/. .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar sitio
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Guardar proyecto limpio en main
        shell: bash
        run: |
          rm -rf .bundle .bundle2
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar proyecto Costeo Salsas" || exit 0
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
