name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build:pages

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/465339579029/locations/global/workloadIdentityPools/github-plcocina/providers/github-actions
          service_account: github-firebase-deploy@plcocina-apps.iam.gserviceaccount.com
          project_id: plcocina-apps
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify federated credentials
        run: |
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth application-default print-access-token >/dev/null

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.22.1

      - name: Deploy Firebase Hosting target
        run: firebase deploy --only hosting:salsas --project plcocina-apps --non-interactive
